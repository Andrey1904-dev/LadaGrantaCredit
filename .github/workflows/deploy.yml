name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Права для деплоя на Pages
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Ключи Supabase. Значения ищутся в таком порядке:
      #   1. Secrets репозитория (Settings → Secrets and variables → Actions → Secrets)
      #   2. Variables репозитория (там же, вкладка Variables)
      #   3. URL проекта — значение по умолчанию ниже (URL публичный, как в README)
      # Если anon-ключ не найден — деплой обрывается с понятной ошибкой,
      # иначе на Pages уехала бы сборка в демо-режиме без регистрации.
      - name: Проверить ключи Supabase
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || vars.VITE_SUPABASE_URL || 'https://dcgurmwvpgzmlfivxoso.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          FAIL=0
          if [ -z "$VITE_SUPABASE_URL" ]; then
            echo "::error title=Не задан VITE_SUPABASE_URL::Добавьте его в Settings → Secrets and variables → Actions (Secrets или Variables)."
            FAIL=1
          elif ! [[ "$VITE_SUPABASE_URL" == https://* ]] || [[ "$VITE_SUPABASE_URL" == *your-project-ref* ]]; then
            echo "::error title=Некорректный VITE_SUPABASE_URL::Ожидался адрес вида https://<project-ref>.supabase.co (Settings → API в дашборде Supabase)."
            FAIL=1
          fi
          if [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "::error title=Не задан VITE_SUPABASE_ANON_KEY::Добавьте publishable (anon) ключ проекта в Settings → Secrets and variables → Actions → Secrets (или Variables). Взять: Supabase Dashboard → Project Settings → API → Project API keys → anon/publishable."
            FAIL=1
          fi
          if [ "$FAIL" -ne 0 ]; then
            echo "Деплой отменён: без ключей Supabase сайт публикуется без работающей регистрации."
            exit 1
          fi

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || vars.VITE_SUPABASE_URL || 'https://dcgurmwvpgzmlfivxoso.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || vars.VITE_SUPABASE_ANON_KEY }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
