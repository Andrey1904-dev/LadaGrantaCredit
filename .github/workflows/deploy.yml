name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Минимальные права по умолчанию; разрешения Pages выдаются только deploy-job.
permissions:
  contents: read

concurrency:
  group: pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Ключи Supabase. Значения ищутся в таком порядке:
      #   1. Secrets репозитория (Settings → Secrets and variables → Actions → Secrets)
      #   2. Variables репозитория (там же, вкладка Variables)
      #   3. URL проекта — значение по умолчанию ниже (URL публичный, как в README)
      # Если anon-ключ не найден — деплой обрывается с понятной ошибкой,
      # иначе на Pages уехала бы сборка в демо-режиме без регистрации.
      - name: Проверить ключи Supabase
        if: github.event_name != 'pull_request'
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || vars.VITE_SUPABASE_URL || 'https://dcgurmwvpgzmlfivxoso.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          FAIL=0
          if [ -z "$VITE_SUPABASE_URL" ]; then
            echo "::error title=Не задан VITE_SUPABASE_URL::Добавьте его в Settings → Secrets and variables → Actions (Secrets или Variables)."
            FAIL=1
          elif ! [[ "$VITE_SUPABASE_URL" == https://* ]] || [[ "$VITE_SUPABASE_URL" == *your-project-ref* ]]; then
            echo "::error title=Некорректный VITE_SUPABASE_URL::Ожидался адрес вида https://<project-ref>.supabase.co (Settings → API в дашборде Supabase)."
            FAIL=1
          fi
          if [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "::error title=Не задан VITE_SUPABASE_ANON_KEY::Добавьте publishable (anon) ключ проекта в Settings → Secrets and variables → Actions → Secrets (или Variables). Взять: Supabase Dashboard → Project Settings → API → Project API keys → anon/publishable."
            FAIL=1
          fi
          if [ "$FAIL" -ne 0 ]; then
            echo "Деплой отменён: без ключей Supabase сайт публикуется без работающей регистрации."
            exit 1
          fi

      # Публичные переменные бота. Проверка ловит самую частую ошибку —
      # токен BotFather в VITE_*: он попадает в открытый JS-бандл на Pages,
      # и любой посетитель может управлять ботом. Такой деплой лучше отменить.
      - name: Проверить переменные Telegram-бота
        env:
          VITE_TELEGRAM_BOT_USERNAME: ${{ vars.VITE_TELEGRAM_BOT_USERNAME }}
          VITE_TELEGRAM_API_URL: ${{ vars.VITE_TELEGRAM_API_URL }}
        run: |
          FAIL=0
          if [[ "$VITE_TELEGRAM_API_URL" =~ ^[0-9]{6,12}:[A-Za-z0-9_-]{25,}$ ]] || [[ "$VITE_TELEGRAM_BOT_USERNAME" =~ ^[0-9]{6,12}:[A-Za-z0-9_-]{25,}$ ]]; then
            echo "::error title=Токен бота попал в переменные сборки::VITE_TELEGRAM_API_URL должен содержать HTTPS-адрес API бота, а не токен BotFather. Немедленно отзовите токен командой /revoke в @BotFather, затем укажите в VITE_TELEGRAM_API_URL адрес сервиса бота (например, https://<project-ref>.supabase.co/functions/v1/telegram-api)."
            FAIL=1
          fi
          if [ -n "$VITE_TELEGRAM_API_URL" ] && [[ "$VITE_TELEGRAM_API_URL" != https://* ]]; then
            echo "::error title=Некорректный VITE_TELEGRAM_API_URL::Нужен полный HTTPS-адрес API бота. Относительный путь вроде /telegram-api работает только в режиме разработки через прокси Vite."
            FAIL=1
          fi
          if [ -n "$VITE_TELEGRAM_BOT_USERNAME" ] && [ -z "$VITE_TELEGRAM_API_URL" ]; then
            echo "::notice title=Раздел «Бот» будет в режиме настройки::Задайте VITE_TELEGRAM_API_URL — HTTPS-адрес API бота, чтобы подключение аккаунта заработало."
          fi
          if [ -n "$VITE_TELEGRAM_API_URL" ] && [ -z "$VITE_TELEGRAM_BOT_USERNAME" ]; then
            echo "::error title=Не задан VITE_TELEGRAM_BOT_USERNAME::Укажите публичное имя бота без @ (например, LadaGarage_bot), иначе кнопка «Открыть бота» не появится."
            FAIL=1
          fi
          if [ "$FAIL" -ne 0 ]; then
            echo "Деплой отменён: исправьте переменные Telegram, чтобы в сборку не уехал токен или нерабочий адрес API."
            exit 1
          fi

      - name: Check and build
        run: npm run check
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || vars.VITE_SUPABASE_URL || 'https://dcgurmwvpgzmlfivxoso.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || vars.VITE_SUPABASE_ANON_KEY }}
          # Имя бота и HTTPS URL его API не являются секретами — GitHub Actions Variables.
          VITE_TELEGRAM_BOT_USERNAME: ${{ vars.VITE_TELEGRAM_BOT_USERNAME }}
          VITE_TELEGRAM_API_URL: ${{ vars.VITE_TELEGRAM_API_URL }}

      - name: Setup Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
